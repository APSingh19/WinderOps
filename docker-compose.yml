services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017/team_task_manager
      JWT_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo

volumes:
  mongo-data:
